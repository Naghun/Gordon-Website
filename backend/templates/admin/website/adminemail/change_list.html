{% extends "admin/change_list.html" %}
{% block object-tools-items %}
  <li><a href="{% url 'admin:website_adminemail_refresh' %}?mailbox={{ selected_mailbox }}" class="email-refresh-button">Osvježi emailove</a></li>
  <li><a href="{% url 'admin:website_adminemail_compose' %}" class="addlink">Napiši novi email</a></li>
  {{ block.super }}
{% endblock %}

{% block search %}
<div style="clear:both;padding:16px 20px;margin-bottom:12px;background:#101819;border-radius:10px;">
  <form method="get" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
    {% for key,value in mailbox_filters %}<input type="hidden" name="{{ key }}" value="{{ value }}">{% endfor %}
    <label for="emails-mailbox" style="color:#fff;font-weight:600;">Email sandučić</label>
    <select id="emails-mailbox" name="mailbox__exact" onchange="this.form.submit()" style="min-width:240px;max-width:100%;height:40px;border:1px solid #26c6cc;border-radius:6px;background:#172b2d;color:#fff;padding:8px;">
      {% for box in mailboxes %}<option value="{{ box.id }}" {% if box.id == selected_mailbox %}selected{% endif %}>{{ box.label }}</option>{% endfor %}
    </select>
    <noscript><button type="submit">Prikaži</button></noscript>
  </form>
</div>
{{ block.super }}
{% endblock %}
