name: Deploy gordon.ba

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: gordon-ba-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-and-deploy:
    name: Validate and deploy production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Check Django project
        run: |
          python -m pip install -r backend/requirements.txt
          python backend/manage.py check

      - name: Configure restricted SSH key
        env:
          DEPLOY_KEY: ${{ secrets.GORDON_BA_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.GORDON_BA_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/gordon_ba_deploy
          chmod 600 ~/.ssh/gordon_ba_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy only gordon.ba
        run: |
          ssh -i ~/.ssh/gordon_ba_deploy -p 22 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            gordondm@s3085.fra1.stableserver.net \
            "deploy $GITHUB_SHA"

      - name: Verify public endpoints
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 https://gordon.ba/ >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 3 https://gordon.ba/blog/ >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 3 https://gordon.ba/backend/api/blog/ >/dev/null
